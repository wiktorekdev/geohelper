name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Fill in what you can — the more detail, the faster the fix.

  - type: input
    id: version
    attributes:
      label: GeoHelper version
      description: Check in Settings → About
      placeholder: "e.g. 0.18.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: Install type
      options:
        - Installer (.msi / .exe setup)
        - Portable (.exe standalone)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. Screenshots or screen recordings help a lot.
      placeholder: "When I open a round on a custom map, the sidebar stays on 'Waiting for round...'"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: "The sidebar should show coordinates and country info."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Open GeoGuessr on Steam
        2. Start a round on [map name]
        3. ...
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, config, Steam launch options — whatever might help.
    validations:
      required: false
