name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: install linux build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: install npm deps
        run: npm ci

      - name: prepare signing key
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/geohelper.key"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$KEY_FILE"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_FILE" >> "$GITHUB_ENV"

      - name: build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: stage artifacts (windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "release-staging"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item "src-tauri/target/release/geohelper.exe" "$stage/GeoHelper-$version-windows-portable.exe"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "$stage/GeoHelper-$version-windows-setup.exe"
          }
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "$stage/GeoHelper-$version-windows.msi"
          }

          # Updater artifact: NSIS setup exe + signature (Tauri 2 signs the setup.exe directly)
          $updaterExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($updaterExe -and (Test-Path "$($updaterExe.FullName).sig")) {
            Copy-Item "$($updaterExe.FullName).sig" "$stage/GeoHelper-$version-windows-setup.exe.sig"
          }

          Get-ChildItem "$stage" -File -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii "$stage/SHA256SUMS-windows.txt"
          }

          Get-ChildItem $stage

      - name: stage artifacts (linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          stage="release-staging"
          mkdir -p "$stage"

          if [ -f src-tauri/target/release/geohelper ]; then
            cp src-tauri/target/release/geohelper "$stage/GeoHelper-$version-linux"
            chmod +x "$stage/GeoHelper-$version-linux"
          fi

          deb=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n1 || true)
          if [ -n "$deb" ]; then
            cp "$deb" "$stage/GeoHelper-$version-linux.deb"
          fi

          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n1 || true)
          if [ -n "$appimage" ]; then
            cp "$appimage" "$stage/GeoHelper-$version-linux.AppImage"
            # Updater signature for AppImage
            if [ -f "$appimage.sig" ]; then
              cp "$appimage.sig" "$stage/GeoHelper-$version-linux.AppImage.sig"
            fi
          fi

          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -n1 || true)
          if [ -n "$rpm" ]; then
            cp "$rpm" "$stage/GeoHelper-$version-linux.rpm"
          fi

          (cd "$stage" && sha256sum * > SHA256SUMS-linux.txt || true)
          ls -la "$stage"

      - name: stage artifacts (macos)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          stage="release-staging"
          mkdir -p "$stage"

          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -n1 || true)
          if [ -n "$dmg" ]; then
            cp "$dmg" "$stage/GeoHelper-$version-macos.dmg"
          fi

          app_tar=$(ls src-tauri/target/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -n1 || true)
          if [ -n "$app_tar" ]; then
            cp "$app_tar" "$stage/GeoHelper-$version-macos.app.tar.gz"
            if [ -f "$app_tar.sig" ]; then
              cp "$app_tar.sig" "$stage/GeoHelper-$version-macos.app.tar.gz.sig"
            fi
          fi

          app_dir=$(ls -d src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -n1 || true)
          if [ -n "$app_dir" ]; then
            (cd "$(dirname "$app_dir")" && zip -qry "$GITHUB_WORKSPACE/$stage/GeoHelper-$version-macos.app.zip" "$(basename "$app_dir")")
          fi

          (cd "$stage" && shasum -a 256 * > SHA256SUMS-macos.txt || true)
          ls -la "$stage"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geohelper-${{ matrix.name }}
          path: release-staging/*
          if-no-files-found: ignore

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: geohelper-*
          merge-multiple: true

      - name: combine checksums
        shell: bash
        run: |
          cd release-artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt 2>/dev/null || true
          rm -f SHA256SUMS-*.txt
          ls -la

      - name: generate updater manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd release-artifacts
          version="${TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          read_sig() {
            local f="$1"
            if [ -f "$f" ]; then
              cat "$f"
            else
              echo ""
            fi
          }

          win_zip=$(ls GeoHelper-*-windows-setup.exe 2>/dev/null | head -n1 || true)
          lin_img=$(ls GeoHelper-*-linux.AppImage 2>/dev/null | head -n1 || true)
          mac_tar=$(ls GeoHelper-*-macos.app.tar.gz 2>/dev/null | head -n1 || true)

          win_sig=$(read_sig "${win_zip}.sig")
          lin_sig=$(read_sig "${lin_img}.sig")
          mac_sig=$(read_sig "${mac_tar}.sig")

          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          platforms="{}"

          add_platform() {
            local key="$1"
            local file="$2"
            local sig="$3"
            if [ -n "$file" ] && [ -n "$sig" ]; then
              platforms=$(jq --arg k "$key" \
                            --arg u "${base}/${file}" \
                            --arg s "$sig" \
                            '. + { ($k): { url: $u, signature: $s } }' <<< "$platforms")
            fi
          }

          add_platform "windows-x86_64" "$win_zip" "$win_sig"
          add_platform "linux-x86_64"   "$lin_img" "$lin_sig"
          add_platform "darwin-x86_64"  "$mac_tar" "$mac_sig"
          add_platform "darwin-aarch64" "$mac_tar" "$mac_sig"

          jq -n \
            --arg version "$version" \
            --arg notes "See the release page for details." \
            --arg pub_date "$pub_date" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > latest.json

          echo "--- latest.json ---"
          cat latest.json

      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          append_body: true
          body: |
            ## What's new in v0.13.0

            **Added**
            - Layout editor: pencil icon in the sidebar header. Drag to reorder sections, per-section style (visibility, size S/M/L, bold, any color).
            - Mock preview data loads when you enter edit mode without a round active.
            - Hide-the-map toggle in the edit toolbar (stops all tile requests).
            - Tooltips on header icons and actions.
            - Toasts for "copied" / "layout reset" feedback.
            - Friendly error screen instead of a black window if the UI crashes.

            **Changed**
            - Coordinates card: two buttons, branded Google Maps action replaces the plain link.

            **Removed**
            - Street View shortcut (froze for some users).
            - DevTools context menu in release builds.

            See [CHANGELOG.md](https://github.com/wiktorekdev/geohelper/blob/main/CHANGELOG.md) for the full history.

            ## Install notes

            - **Windows**: run the `-setup.exe` installer, or the `-portable.exe` directly.
            - **Linux**: `.deb` for Debian/Ubuntu, `.rpm` for Fedora, or the `.AppImage` (make it executable and run it).
            - **macOS**: the build is unsigned. Right-click the `.app` and choose **Open** the first time, or run `xattr -dr com.apple.quarantine /Applications/GeoHelper.app`. See the [FAQ](https://wiktorekdev.github.io/geohelper/#faq) for details.

            Existing installs on 0.12+ update automatically. Checksums are in `SHA256SUMS.txt`.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
